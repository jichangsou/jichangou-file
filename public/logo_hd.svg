<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="60%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#05070A" />
    </radialGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Purple Indigo Gradient -->
    <linearGradient id="purpleIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card Base -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGlow)"/>
  <rect width="1020" height="1020" x="2" y="2" rx="218" stroke="url(#cyanElectric)" stroke-width="4" stroke-opacity="0.25" fill="none"/>

  <!-- Outer Radar Search Signal Rings (代表 "搜" 探针) -->
  <circle cx="512" cy="460" r="320" stroke="url(#cyanElectric)" stroke-width="3" stroke-dasharray="16 16" stroke-opacity="0.3"/>
  <circle cx="512" cy="460" r="240" stroke="url(#purpleIndigo)" stroke-width="2" stroke-dasharray="12 24" stroke-opacity="0.4"/>
  <circle cx="512" cy="460" r="160" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Radar Scanning Pulse Lines -->
  <path d="M 192 460 A 320 320 0 0 1 512 140" stroke="url(#cyanElectric)" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Central Jet Supersonic Wings (代表 "机场" / 网络加速) -->
  <!-- Left Wing -->
  <path d="M 512 200 L 260 560 L 460 520 Z" fill="url(#cyanElectric)" filter="url(#neonGlow)"/>
  
  <!-- Right Wing -->
  <path d="M 512 200 L 764 560 L 564 520 Z" fill="url(#cyanElectric)" opacity="0.85"/>
  
  <!-- Central Fuselage Core -->
  <path d="M 512 160 L 512 600 L 485 530 Z" fill="#FFFFFF"/>
  <path d="M 512 160 L 539 530 L 512 600 Z" fill="#E2F7FF"/>

  <!-- Speed Booster Tail Flame -->
  <path d="M 470 560 L 512 700 L 554 560 L 512 580 Z" fill="url(#purpleIndigo)" filter="url(#intenseGlow)"/>
  <path d="M 490 560 L 512 650 L 534 560 Z" fill="#00F2FE" filter="url(#neonGlow)"/>

  <!-- Node Dots (代表 24 小时节点探针) -->
  <circle cx="512" cy="160" r="12" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="260" cy="560" r="10" fill="#00F2FE" filter="url(#neonGlow)"/>
  <circle cx="764" cy="560" r="10" fill="#00F2FE" filter="url(#neonGlow)"/>
  <circle cx="512" cy="700" r="8" fill="#E100FF" filter="url(#neonGlow)"/>

  <!-- Typography Brand Section -->
  <!-- Main Brand Title "机场搜" -->
  <text x="512" y="810" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="12" filter="url(#intenseGlow)">
    机场搜
  </text>
  
  <!-- Subtitle Domain "JICHANGSOU.COM" -->
  <text x="512" y="890" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" fill="url(#cyanElectric)" letter-spacing="10">
    JICHANGSOU.COM
  </text>

  <!-- Tagline Badge -->
  <rect x="362" y="915" width="300" height="40" rx="20" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="512" y="942" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#00F2FE" letter-spacing="4">
    2026 节点测评与探针大盘
  </text>
</svg>
