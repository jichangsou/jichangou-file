<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>机场搜 (jichangsou.com) • 高清 Logo 预览与导出</title>
  <style>
    body {
      margin: 0;
      background: #06090e;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .logo-card {
      width: 512px;
      height: 512px;
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 242, 254, 0.25);
      transition: transform 0.3s ease;
    }
    .logo-card:hover {
      transform: scale(1.02);
    }
    .actions {
      margin-top: 32px;
      display: flex;
      gap: 16px;
    }
    .btn {
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      background: #00f2fe;
      color: #000;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>机场搜 • 高清 4K 品牌 Logo</h1>
  <p>支持 1024×1024 矢量高保真渲染，可直接用于网站 Header、Favicon 与品牌名片</p>
  
  <img src="/logo_hd.svg" alt="机场搜 高清 Logo" class="logo-card" />

  <div class="actions">
    <a href="/logo_hd.svg" download="jichangsou_hd_logo.svg" class="btn">📥 下载 SVG 高清矢量源文件</a>
  </div>
</body>
</html>
